[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilypad"
version = "0.1.0"
description = "Toddler Keyboard Playground - locked-down fullscreen key-mash fun for a Raspberry Pi + Razer BlackWidow Chroma"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pygame-ce>=2.4",
]

[project.optional-dependencies]
pi = [
    "evdev>=1.6",
    "pyusb>=1.2",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
lilypad = "lilypad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
