[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilypad"
version = "0.1.0"
description = "Toddler Keyboard Playground - locked-down fullscreen key-mash fun for a Raspberry Pi + Razer BlackWidow Chroma"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pygame-ce>=2.4",
]

[project.optional-dependencies]
pi = [
    "evdev>=1.6",
    "pyusb>=1.2",
]
dev = [
    "pytest>=7.4",
]
art = ["pillow", "numpy", "scipy"]

[project.scripts]
lilypad = "lilypad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The traced animal outlines. Without this they are left out of a non-editable
# install and every silhouette animal silently falls back to the drawn one.
lilypad = ["assets/silhouettes/*.svg", "assets/silhouettes/*.md"]
# Setuptools discovers the asset directories as namespace packages under src/.
# Recursive patterns cover manifests at the root and assets nested by creature or mood.
"lilypad.assets.painted" = ["**/*.webp", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.toml", "**/*.md", "**/*.json", "**/*.wav", "**/*.ogg", "**/*.mp3"]
"lilypad.assets.world" = ["**/*.webp", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.toml", "**/*.md", "**/*.json", "**/*.wav", "**/*.ogg", "**/*.mp3"]
"lilypad.assets.storybook" = ["**/*.webp", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.toml", "**/*.md", "**/*.json", "**/*.wav", "**/*.ogg", "**/*.mp3"]
"lilypad.assets.fx" = ["**/*.webp", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.toml", "**/*.md", "**/*.json", "**/*.wav", "**/*.ogg", "**/*.mp3"]
"lilypad.assets.voice" = ["**/*.webp", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.toml", "**/*.md", "**/*.json", "**/*.wav", "**/*.ogg", "**/*.mp3"]
"lilypad.assets.letters" = ["**/*.webp", "**/*.png", "**/*.toml", "**/*.md"]
"lilypad.assets.eyes" = ["**/*.webp", "**/*.png", "**/*.toml", "**/*.md"]
"lilypad.assets.album" = ["**/*.webp", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.toml", "**/*.md"]
"lilypad.assets.music" = ["**/*.webp", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.toml", "**/*.md", "**/*.json", "**/*.wav", "**/*.ogg", "**/*.mp3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
