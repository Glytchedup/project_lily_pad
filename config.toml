# Lily Pad configuration.
# On the Pi this lives at /etc/lilypad/config.toml (install.sh copies it there);
# in dev mode the copy in the repo root is used.

[audio]
# Master mute. true = no sound at all, regardless of volume.
mute = false
# 0.0 .. 1.0
volume = 0.65
# Speech source: "narrator" or "espeak".
voice = "narrator"
# Speak short phrases for animals and letters.
phrases = true
# Count number-key shapes aloud.
count_aloud = true

[music]
# Every key plays a note of the C major pentatonic scale, laid out like a piano
# across the keyboard: lower rows are lower notes, left to right climbs. That
# scale has no clashing intervals, so any handful of keys pressed together is a
# chord. false = no key notes (character cues and chimes only).
key_notes = true
# Background instrumental tunes:
#   "reward" — silence while playing, then a whole track has to be EARNED:
#              new animals met (`reward_rule`, below) buy fireworks and then a full track
#              with Pip throwing a dance party. The track ending ends the
#              party, and the next one has to be earned again.
#   "active" — play while keys are being pressed, fading out after
#              `fade_after` seconds of no activity (see below). Uses whatever
#              audio files are in `background_folder`; falls back to the
#              built-in generated tunes if that folder is empty or missing.
#   "idle"   — play only during the attract animation, fading out on the next
#              keypress, so playing is never competing with backing music
#   "always" — loop continuously
#   "off"    — never
tunes = "reward"
# Background music level, 0.0 .. 1.0. Separate from audio.volume, which sets
# the level of the keypress cues.
tune_volume = 0.6
# Folder of personal MP3/OGG/WAV files to shuffle through in "reward" and
# "active" modes — never checked into git (see .gitignore), so this is safe
# for real songs.
# Resolved relative to the repo root in dev mode, /opt/lilypad in kiosk mode.
background_folder = "music"
# "active" mode only: seconds of no keypress before the music fades out. A
# fade caught mid-track resumes from the same spot, not the top, next time.
fade_after = 30.0
# "reward" mode only. How the track is earned (`reward_rule`):
#   "animals" — meet `reward_animals` DIFFERENT animals since the last party
#               (letters A-Z, the F7-F12 dinosaurs, anything that brings an
#               animal; repeats, numbers and other keys never count). Mashing
#               one key earns nothing. Parties are spaced: at most one every
#               `reward_min_gap` seconds, counted from the previous party's end
#               (the first party of a run has no wait). The party starts the
#               moment the last animal appears; if that lands inside the gap,
#               it starts the moment the gap expires.
#   "play"    — the older meter: `reward_seconds` of engaged play or
#               `reward_presses` keys, whichever lands first.
# reward_window is what makes the seconds mean *play* rather than wall clock:
# a gap longer than this stops counting, so a key touched once a minute never
# earns anything. Progress survives a break; only a party spends it.
# (reward_seconds / reward_presses / reward_window are used by "play" only;
# reward_animals / reward_min_gap by "animals" only.)
reward_rule = "animals"
reward_animals = 8
reward_min_gap = 120.0
reward_seconds = 60.0
reward_presses = 50
reward_window = 10.0
# Party mix. The reward track is the event, so it plays near full while the
# key cues drop under it — loud music, soft typing. Both 0.0 .. 1.0.
party_volume = 0.95
party_duck = 0.25
# Include packaged music in the reward playlist.
bundled_tracks = true
# Preferred reward music: "folder_first", "bundled" or "generated".
reward_source = "folder_first"
# Synchronize the keyboard, characters and fireflies to the reward track (120 BPM without a map).
party_show = true

[display]
# Dev-mode window size; kiosk mode always uses the display's native fullscreen mode.
dev_window = [1280, 720]
# Target frames per second.
fps = 60
# Seconds of no keypresses before the idle "attract" animation starts.
idle_timeout = 60.0
# Seconds of no keypresses before the screen goes fully black and the keyboard
# lights go out — the app is still running, and the very next keypress brings
# everything straight back. 0 disables sleeping entirely.
#
# This is a black picture, not a powered-down HDMI output: on a Pi 5 there is
# no way to switch the output off from software (vcgencmd display_power is
# gone, and the DRM dpms node is read-only), and blanking the output would risk
# the monitor dropping hot-plug detect — the exact deadlock that forced
# video=HDMI-A-1:...D into cmdline.txt. Use the monitor's own power saving if
# you want the backlight off too.
sleep_timeout = 300.0

[effects]
# Hard cap on live particles; the engine lowers this automatically if the frame
# budget is exceeded (graceful degradation).
max_particles = 900
# 2-key chord detection window, seconds.
chord_window = 0.15
# Motion trails: effects streak and fade instead of vanishing. Costs roughly
# one extra full-screen alpha blit per frame (plus a periodic anti-ghost pass).
# The engine sheds trails automatically under heavy load; set false to always
# use the cheap opaque clear (e.g. on a Pi 4 that can't hold 60 fps).
trails = true
# A mega-celebration (fireworks + confetti + balloons + frog party) fires every
# this many keypresses. 0 disables milestones.
milestone_every = 50
# Traced-outline animals. A few creatures (currently giraffe, triceratops and
# whale) are drawn from a real anatomical outline instead of being assembled
# from ellipses — the shape comes from a public-domain silhouette, everything
# else about them is still generated. false puts those three back to the drawn
# version, which is the point: it is a trial, and this is how you compare.
# Ignored if this machine's SDL_image cannot rasterise SVG; it falls back to
# the drawn animals and says so in the log.
silhouettes = true
# Animal art: "painted", "traced" or "drawn". Overrides silhouettes.
animal_art = "painted"
# Pip and his pad: "painted" or "drawn".
pip_art = "painted"
# Maximum sprite width as a fraction of screen width, 0 disables the cap.
max_sprite_width = 0.60
# Draw moving sprites over the trails.
clean_sprites = true
# Enable encounters between animals and Pip.
ecosystem = true
# Show storybook cards during "encore", "attract", "both" or "off".
storybook = "both"
# Effect artwork: "painted" or "glow".
fx_style = "painted"
# Collect animal portraits in the session album.
album = true
# Celebrate completing the alphabet with the Grand Parade.
parade = true

[scene]
# Scene art and layout: "painted" pond or "drawn" classic.
world = "painted"
# Drift painted scenery layers at different speeds.
parallax = true
# Reflect walkers and hoppers below the bank.
reflections = true
# Show fireflies over the painted pond.
fireflies = true
# Minutes between painted mood changes, must be positive.
mood_minutes = 5.0
# Lily, the child in the pond, sits at a spot and moves now and then.
lily = true
# Seconds awake between her moves to a new spot, must be positive.
lily_move_seconds = 75

[lighting]
# Backend: "auto" tries razer_hid, then openrazer, then mock.
# Force one with "razer_hid" | "openrazer" | "mock".
backend = "auto"
# Keyboard LED brightness, 0.0 .. 1.0.
brightness = 0.9
# Lighting frame rate (keyboard USB updates per second).
fps = 30
# Mirror on-screen animals on the keyboard LEDs.
mirror_animals = true

[escape]
# Parent escape hatch: hold ALL of these keys together for `hold_seconds`.
# Key names follow Linux evdev naming without the KEY_ prefix.
combo = ["LEFTSHIFT", "RIGHTSHIFT", "BACKSPACE"]
hold_seconds = 5.0
# Seconds to show the session summary after the parent escape combo, 0 disables it.
summary_seconds = 8.0
