# Lily Pad configuration.
# On the Pi this lives at /etc/lilypad/config.toml (install.sh copies it there);
# in dev mode the copy in the repo root is used.

[audio]
# Master mute. true = no sound at all, regardless of volume.
mute = false
# 0.0 .. 1.0
volume = 0.8

[music]
# Every key plays a note of the C major pentatonic scale, laid out like a piano
# across the keyboard: lower rows are lower notes, left to right climbs. That
# scale has no clashing intervals, so any handful of keys pressed together is a
# chord. false = no key notes (character cues and chimes only).
key_notes = true
# Background instrumental tunes:
#   "off"    — never (default): an unattended playground goes quiet, which is
#              what you want in a room where a toddler has wandered off. Music
#              that plays to an empty room is just noise in the house.
#   "idle"   — play only during the attract animation, fading out on the next
#              keypress, so playing is never competing with backing music
#   "always" — loop continuously
tunes = "off"
# Background music level, 0.0 .. 1.0. Separate from audio.volume, which sets
# the level of the keypress cues.
tune_volume = 0.45
# The short piano flourish that plays when Pip celebrates — the count-along
# milestones and mash storms. This is a discrete event cue, not background
# music: the playground still goes quiet when nobody is playing. false swaps
# milestones back to the older cadence fanfare and leaves mash storms with
# just their chord swell.
flourish = true

[display]
# Dev-mode window size; kiosk mode always uses the display's native fullscreen mode.
dev_window = [1280, 720]
# Target frames per second.
fps = 60
# Seconds of no keypresses before the idle "attract" animation starts.
idle_timeout = 60.0
# Seconds of no keypresses before the screen goes fully black and the keyboard
# lights go out — the app is still running, and the very next keypress brings
# everything straight back. 0 disables sleeping entirely.
#
# This is a black picture, not a powered-down HDMI output: on a Pi 5 there is
# no way to switch the output off from software (vcgencmd display_power is
# gone, and the DRM dpms node is read-only), and blanking the output would risk
# the monitor dropping hot-plug detect — the exact deadlock that forced
# video=HDMI-A-1:...D into cmdline.txt. Use the monitor's own power saving if
# you want the backlight off too.
sleep_timeout = 300.0

[effects]
# Hard cap on live particles; the engine lowers this automatically if the frame
# budget is exceeded (graceful degradation).
max_particles = 900
# 2-key chord detection window, seconds.
chord_window = 0.15
# Motion trails: effects streak and fade instead of vanishing. Costs roughly
# one extra full-screen alpha blit per frame (plus a periodic anti-ghost pass).
# The engine sheds trails automatically under heavy load; set false to always
# use the cheap opaque clear (e.g. on a Pi 4 that can't hold 60 fps).
trails = true
# A mega-celebration (fireworks + confetti + balloons + frog party) fires every
# this many keypresses. 0 disables milestones.
milestone_every = 50
# Traced-outline animals. A few creatures (currently giraffe, triceratops and
# whale) are drawn from a real anatomical outline instead of being assembled
# from ellipses — the shape comes from a public-domain silhouette, everything
# else about them is still generated. false puts those three back to the drawn
# version, which is the point: it is a trial, and this is how you compare.
# Ignored if this machine's SDL_image cannot rasterise SVG; it falls back to
# the drawn animals and says so in the log.
silhouettes = true

[lighting]
# Backend: "auto" tries razer_hid, then openrazer, then mock.
# Force one with "razer_hid" | "openrazer" | "mock".
backend = "auto"
# Keyboard LED brightness, 0.0 .. 1.0.
brightness = 0.9
# Lighting frame rate (keyboard USB updates per second).
fps = 30

[escape]
# Parent escape hatch: hold ALL of these keys together for `hold_seconds`.
# Key names follow Linux evdev naming without the KEY_ prefix.
combo = ["LEFTSHIFT", "RIGHTSHIFT", "BACKSPACE"]
hold_seconds = 5.0
